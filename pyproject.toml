[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-firewall"
version = "0.1.0"
description = "Signed intent and persistent taint policy for prompt-injection defense"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "its-DeFine" }]

[project.optional-dependencies]
test = ["pytest>=8"]
prompt-guard = ["torch>=2.2", "transformers>=4.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
